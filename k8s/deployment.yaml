apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
      - name: flask

        image: flask-api:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        env:
        - name: APP_ENV
          valueFrom:
            secretKeyRef:
              name: flask-secret
              key: APP_ENV
        
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: flask-config
              key: LOG_LEVEL

        - name: APP_REGION
          valueFrom:
            configMapKeyRef:
              name: flask-config
              key: APP_REGION
              
